# ─────────────────────────────────────────────────────────────────────────────
# Wind Forecast Portal — local development / demo stack
#
# Usage:
#   docker compose up --build          # start both services
#   docker compose up --build backend  # backend only
#
# Access:
#   http://localhost:3000              # Frontend (nginx → SPA + /api proxy)
#   http://localhost:8000/api/health   # Backend direct (for debugging)
#
# nginx proxies /api/* to http://backend:8000 over the Docker network.
# No .env file or secrets are required.
# ─────────────────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
