# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — serves the Vite-built SPA and proxies /api to the backend.
#
# Two responsibilities:
#   1. Proxy /api/* requests to the backend container (http://backend:8000).
#   2. SPA fallback: any non-file URL (e.g. /accuracy) returns index.html
#      so React Router can handle client-side routing on page refresh.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Static assets (JS, CSS, images) — long cache ──────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — return index.html for all other routes ─────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
