[pytest]
# Add the backend package root (the directory containing 'app/') to sys.path
# so 'from app.main import app' resolves correctly without needing an editable install.
pythonpath = .
testpaths = tests

# Disable the anyio pytest plugin to prevent it from conflicting with
# Starlette's synchronous TestClient (which uses anyio internally via
# anyio.from_thread.start_blocking_portal).
addopts = -p no:anyio

# Suppress spurious NumPy DeprecationWarning fired by pandas 2.3 internals
# when using pd.Timedelta with timezone-aware Timestamps.
filterwarnings =
    ignore::DeprecationWarning
